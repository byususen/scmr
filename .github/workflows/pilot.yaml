name: dynamic-pilot

# Runs on every push to a branch named pilot/<tag>; the arguments are read from
# inst/simulation/dynamic/pilot_args.txt; results go to branch ci-logs/pilot-<tag>.
on:
  push:
    branches: ['pilot/**']

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check
      - name: Run pilot
        run: |
          mkdir -p "$RUNNER_TEMP/pilot_out"
          ARGS=$(cat inst/simulation/dynamic/pilot_args.txt)
          echo "$ARGS" > "$RUNNER_TEMP/pilot_out/args.txt"
          Rscript inst/simulation/dynamic/pilot.R $ARGS out="$RUNNER_TEMP/pilot_out" 2>&1 | tee "$RUNNER_TEMP/pilot_out/log.txt"
      - name: Publish results to branch ci-logs/<tag>
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/pilot_out"
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}" > RUN.txt
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Pilot ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-logs/pilot-${GITHUB_REF_NAME#pilot/}

  empirical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::lightgbm
          needs: check
      - name: Run empirical v3 on synthetic KSA-shaped data
        run: |
          out="$RUNNER_TEMP/emp_out"
          mkdir -p "$out"
          # Optional settings for a larger synthetic run: inst/empirical/ci_env.txt (KEY=VALUE lines)
          if [ -f inst/empirical/ci_env.txt ]; then set -a; . inst/empirical/ci_env.txt; set +a; fi
          Rscript inst/empirical/make_fake_ksa.R "$RUNNER_TEMP/fake.csv"
          SCMR_DATA_FILE="$RUNNER_TEMP/fake.csv" SCMR_OUTPUT_DIR="$out" SCMR_PROFILE="${SCMR_PROFILE:-ci}" \
            Rscript inst/empirical/SCMR_EN_empirical_article_v3.R 2>&1 | tee "$out/log.txt"
      - name: Publish results to branch ci-logs/empirical-<tag>
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/emp_out"
          rm -rf runs cache
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}" > RUN.txt
          git init -q
          git checkout -q -b logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Empirical smoke ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-logs/empirical-${GITHUB_REF_NAME#pilot/}
